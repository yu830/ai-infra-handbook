<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Noto Sans SC, sans-serif">
  <rect width="820" height="220" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="24" y="30" font-size="13" font-weight="700" fill="#18181b">PagedAttention（固定块分页） vs. RadixAttention（前缀基数树）</text>
  <rect x="24" y="46" width="376" height="156" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="40" y="68" font-size="11.5" font-weight="700" fill="#18181b">A. PagedAttention：Block Table → 非连续 HBM</text>
  <rect x="40" y="82" width="66" height="24" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="73" y="98" font-size="10.5" fill="#18181b" text-anchor="middle">L-Blk 0</text>
  <rect x="40" y="114" width="66" height="24" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="73" y="130" font-size="10.5" fill="#18181b" text-anchor="middle">L-Blk 1</text>
  <rect x="40" y="146" width="66" height="24" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="73" y="162" font-size="10.5" fill="#18181b" text-anchor="middle">L-Blk 2</text>
  <rect x="134" y="82" width="74" height="88" rx="3" fill="#fafafa" stroke="#18181b"/>
  <text x="171" y="98" font-size="10.5" fill="#18181b" text-anchor="middle">0 → P3</text>
  <text x="171" y="130" font-size="10.5" fill="#18181b" text-anchor="middle">1 → P0</text>
  <text x="171" y="162" font-size="10.5" fill="#18181b" text-anchor="middle">2 → P5</text>
  <rect x="254" y="82" width="60" height="24" rx="3" fill="#0f766e"/>
  <text x="284" y="98" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">P0 (A1)</text>
  <rect x="322" y="82" width="60" height="24" rx="3" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="352" y="98" font-size="10" fill="#52525b" text-anchor="middle">P1 Free</text>
  <rect x="254" y="114" width="60" height="24" rx="3" fill="#0f766e"/>
  <text x="284" y="130" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">P3 (A0)</text>
  <rect x="322" y="114" width="60" height="24" rx="3" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="352" y="130" font-size="10" fill="#52525b" text-anchor="middle">P2 (B0)</text>
  <rect x="254" y="146" width="60" height="24" rx="3" fill="#0f766e"/>
  <text x="284" y="162" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">P5 (A2)</text>
  <rect x="322" y="146" width="60" height="24" rx="3" fill="#f4f4f5" stroke="#a1a1aa"/>
  <text x="352" y="162" font-size="10" fill="#52525b" text-anchor="middle">P4 Free</text>
  <path d="M 208 94 C 230 94, 230 126, 252 126" fill="none" stroke="#c25432" stroke-width="1.4" stroke-dasharray="3,2"/>
  <path d="M 208 126 C 230 126, 230 94, 252 94" fill="none" stroke="#0f766e" stroke-width="1.4"/>
  <line x1="208" y1="158" x2="252" y2="158" stroke="#0f766e" stroke-width="1.4"/>
  <text x="40" y="191" font-size="10" fill="#52525b">消除外碎片，支持 Copy-on-Write 与块哈希前缀缓存</text>
  <rect x="420" y="46" width="376" height="156" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="436" y="68" font-size="11.5" font-weight="700" fill="#18181b">B. RadixAttention：前缀基数树 + LRU 驱逐</text>
  <rect x="550" y="78" width="116" height="24" rx="3" fill="#18181b"/>
  <text x="608" y="94" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">System Prompt</text>
  <line x1="580" y1="102" x2="500" y2="120" stroke="#18181b" stroke-width="1.3"/>
  <line x1="636" y1="102" x2="710" y2="120" stroke="#18181b" stroke-width="1.3"/>
  <rect x="438" y="120" width="124" height="24" rx="3" fill="#0f766e"/>
  <text x="500" y="136" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">5-Shot / Tool Defs</text>
  <rect x="648" y="120" width="124" height="24" rx="3" fill="#f4f4f5" stroke="#18181b"/>
  <text x="710" y="136" font-size="10.5" fill="#18181b" text-anchor="middle">Doc Prefix (LRU)</text>
  <rect x="436" y="156" width="84" height="22" rx="3" fill="#fafafa" stroke="#0f766e"/>
  <text x="478" y="171" font-size="10" fill="#18181b" text-anchor="middle">Turn 1</text>
  <rect x="530" y="156" width="94" height="22" rx="3" fill="#fafafa" stroke="#c25432"/>
  <text x="577" y="171" font-size="10" font-weight="700" fill="#c25432" text-anchor="middle">Turn 2 (Hit)</text>
  <rect x="648" y="156" width="124" height="22" rx="3" fill="#ffffff" stroke="#c25432" stroke-dasharray="3,2"/>
  <text x="710" y="171" font-size="10" fill="#c25432" text-anchor="middle">Evict Leaf (Ref=0)</text>
  <text x="436" y="191" font-size="10" fill="#52525b">请求结束后保留前缀自动复用，显存紧张时 LRU 驱逐</text>
</svg>
