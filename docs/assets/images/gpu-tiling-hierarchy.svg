<svg viewBox="0 0 820 206" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Noto Sans SC, sans-serif">
  <rect width="820" height="206" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="24" y="28" font-size="13" font-weight="700" fill="#18181b">GPU 显存层次与 Tiling 融合算子数据流（HBM → L2 → SRAM → Tensor Core）</text>
  <rect x="30" y="146" width="760" height="42" rx="5" fill="#18181b"/>
  <text x="410" y="166" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HBM / Global Memory（8 GB – 192 GB · 基准带宽 1× · 最小化往返）</text>
  <text x="410" y="182" font-size="10" fill="#d4d4d8" text-anchor="middle">存放模型权重、Paged KV Cache 与输入/输出张量；禁止将 [S, S] 注意力矩阵落盘</text>
  <rect x="90" y="96" width="640" height="36" rx="5" fill="#0f766e"/>
  <text x="410" y="119" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">片上 SRAM / Shared Memory（每 SM 64–228 KB · ~10–20× 带宽 · Q/K/V 分块驻留）</text>
  <rect x="160" y="46" width="500" height="36" rx="5" fill="#c25432"/>
  <text x="410" y="69" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Registers &amp; Tensor Cores（Online Softmax · Small-M GEMM · RoPE/RMSNorm 垂直融合）</text>
  <line x1="280" y1="146" x2="280" y2="134" stroke="#52525b" stroke-width="1.6"/>
  <line x1="540" y1="146" x2="540" y2="134" stroke="#52525b" stroke-width="1.6"/>
  <line x1="280" y1="96" x2="280" y2="84" stroke="#52525b" stroke-width="1.6"/>
  <line x1="540" y1="96" x2="540" y2="84" stroke="#52525b" stroke-width="1.6"/>
</svg>
