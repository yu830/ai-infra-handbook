site_name: AI Infra 面试作战手册
site_description: 面向大模型推理引擎研发工程师面试的深度系统工程与项目深挖手册
docs_dir: docs

theme:
  name: material
  language: zh
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 面试总览: index.md
  - 核心原理深度拆解:
      - 01. 物理边界、手算算例与调度循环: inference/roofline-and-batching.md
      - 02. KV 缓存、MLA 与 CUDA Graph: inference/kv-cache-and-cudagraph.md
      - 03. P/D 分离与国产芯片适配: inference/pd-disaggregation.md
      - 04. GPU 显存层次、算子融合与量化: kernels/gpu-memory-and-tiling.md
  - 实战项目与面试压轴:
      - 05. 个人核心项目与 PR 深挖防御: interview/project-deep-dive.md
      - 06. 高频系统设计、业务题与反问: interview/qa-and-business.md
